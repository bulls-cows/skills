[project]
name = "yy-read-xlsx-scripts"
version = "0.1.0"
description = "Read .xlsx workbook content with Python standard library"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.setuptools]
py-modules = ["read_xlsx"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
